# Render 블루프린트: render.com → New → Blueprint → 이 저장소를 고르면 아래대로 만든다.
# 무료 인스턴스(0.1 CPU, 512MB)는 15분 동안 요청이 없으면 잠들고, 디스크가 남지 않아
# 잠들거나 다시 배포하면 만든 프로젝트와 하루 사용량 숫자가 사라진다. 결과는 그 자리에서 ZIP으로 받는다.
services:
  - type: web
    name: card-news-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/config
    autoDeployTrigger: commit
    # 문서만 바뀐 커밋은 다시 배포하지 않는다(다시 배포하면 무료 디스크의 프로젝트가 지워진다)
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - docs/**
    envVars:
      # 아래 값은 블루프린트를 처음 만들 때 Render 화면이 물어본다(저장소에는 넣지 않는다).
      # 이미 만든 서비스라면 Render 대시보드의 Environment 메뉴에서 직접 추가한다.
      - key: GEMINI_API_KEY
        sync: false
      # 접속 주소당 하루 1개 상한에서 빼 줄 주소(운영자 등), 쉼표로 구분. 비워 두어도 된다.
      - key: CARDNEWS_UNLIMITED_IPS
        sync: false
